        * { box-sizing: border-box; }
        .node-group circle { transition: filter 0.2s ease, stroke 0.2s ease; }
        .node-group:hover circle:nth-child(2) { filter: brightness(1.35); }
        .h-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .h-scroll::-webkit-scrollbar-thumb { background: #232326; border-radius: 4px; }
        input[type=text], input[type=number], textarea {
          background:#111113; border:1px solid #232326; color:#e7e3df; border-radius:8px;
          padding:8px 10px; font-family:Inter,sans-serif; font-size:14px; outline:none;
        }
        input[type=text]:focus, input[type=number]:focus, textarea:focus { border-color:#e0263a; }
        button.ghost:hover { background:#1c1012; }
        .sidebar-item, .chip { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:8px; cursor:pointer; margin-bottom:6px; }
        .chip { margin-bottom:0; flex-shrink:0; border-radius:20px; padding:8px 14px; }
        .app-row { display:flex; min-height: calc(100vh - 88px); }
        .sidebar-desktop { width:230px; border-right:1px solid #1a1a1d; padding:18px; overflow-y:auto; flex-shrink:0; }
        .mobile-tabs { display:flex; gap:8px; overflow-x:auto; padding:12px 20px; border-bottom:1px solid #1a1a1d; }
        .canvas-wrap { flex:1; position:relative; overflow:hidden; touch-action:none; background-color:#0a0a0c; background-image: radial-gradient(#1a1a1d 1px, transparent 1px); background-size: 26px 26px; }
        .zoom-controls { position:absolute; right:16px; bottom:16px; display:flex; flex-direction:column; gap:8px; z-index:10; }

        .zoom-btn:hover { background:#1c1012; border-color:#f5f2ee; }
